# With some help from: https://gist.github.com/dgerosa/2e1f47a39180f39bde848e38243efa94

name: build
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pages: write
    steps:
    - name: Set up Git repository
      uses: actions/checkout@v4

    - name: cv
      uses: dante-ev/latex-action@latest
      with:
        root_file: cv
        working_directory: .

    - name: Prepare artifacts
      run: |
          mkdir -p public
          mv cv.pdf public/ahmad-hasan-mubashshir.pdf
          sed -E 's/@PATH@/ahmad-hasan-mubashshir.pdf/' index.html > public/index.html

    - name: Upload Site
      uses: actions/upload-pages-artifact@v3
      with:
        name: github-pages
        path: ./public
        retention-days: 1

    - name: Deploy Site
      uses: actions/deploy-pages@v4

